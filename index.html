<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SecSchoolHub — Secondary School Management</title>
    <meta name="description" content="Secondary school management portal for Malawi featuring Form 1–4 student records, Exam JCE/MSCE grading, MWK fee billing, attendance, library circulation, and staff management." />
    <meta property="og:title" content="SecSchoolHub — Secondary School Management" />
    <meta property="og:description" content="Secondary school management portal for Malawi featuring Form 1–4 student records, Exam JCE/MSCE grading, MWK fee billing, attendance, and staff management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SecSchoolHub" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      @keyframes forthAndBack {
        0% { left: 0%; width: 28%; }
        50% { left: 65%; width: 35%; }
        100% { left: 0%; width: 28%; }
      }
      .loader-forth-and-back {
        position: absolute;
        top: 0;
        bottom: 0;
        border-radius: 9999px;
        background: linear-gradient(90deg, #059669, #10B981, #34D399);
        box-shadow: 0 0 14px rgba(16, 185, 129, 0.8);
        animation: forthAndBack 1.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
    </style>
  </head>
  <body class="bg-[#F7F8FA] text-slate-900 dark:bg-[#0D1117] dark:text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-900 dark:selection:text-emerald-200">
    <div id="root">
      <div id="initial-loader" style="min-height: 100vh; min-height: 100dvh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0D1117; color: #F1F5F9; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; box-sizing: border-box; user-select: none;">
        <div style="display: flex; flex-direction: column; align-items: center; max-width: 320px; width: 100%; text-align: center;">
          <!-- Brand Badge -->
          <div style="position: relative; width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(135deg, #059669, #0f766e); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(5, 150, 105, 0.45); border: 1px solid rgba(52, 211, 153, 0.35); margin-bottom: 16px;">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.42 10.922a1 1 0 0 0-.019-.838L12.83 2.18a2 2 0 0 0-1.66 0L2.6 10.084a1 1 0 0 0 0 1.832l8.57 7.908a2 2 0 0 0 1.66 0l8.57-7.908a1 1 0 0 0 .02-.994Z"/>
              <path d="M22 10v6"/>
              <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>
            </svg>
          </div>
          <!-- Wordmark -->
          <div style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 2px;">
            <span>SecSchool</span><span style="color: #34D399;">Hub</span>
          </div>
          <div style="font-size: 12px; font-weight: 500; color: #94A3B8; margin-top: 4px; margin-bottom: 24px;">
            Malawi Secondary Education Portal
          </div>
          <!-- Robustic Forth & Back Slider -->
          <div style="width: 220px;">
            <div style="position: relative; width: 100%; height: 5px; background: #1E293B; border-radius: 9999px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);">
              <div class="loader-forth-and-back"></div>
            </div>
            <div style="font-size: 11px; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #64748B; margin-top: 10px;">
              Loading portal...
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
